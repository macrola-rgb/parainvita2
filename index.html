<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario del equipo · Vista de invitado</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f8f6f2;--panel:#fff;--ink:#251f18;--line:#e6e0d6;--orange:#e8601c;--orange-light:#ffeadb;--orange-dark:#b8470f}
[data-dark="1"]{--bg:#141414;--panel:#1e1e1e;--ink:#f2efe9;--line:#33312e;--orange:#e8601c;--orange-light:#3a2417;--orange-dark:#ffb88c}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.sm{padding:6px 12px;font-size:13px}.btn:hover{border-color:var(--orange)}
a.lk{color:var(--orange-dark);text-decoration:underline;word-break:break-all}
/* ===== Vista de invitado ===== */
#guest-root{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.g-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.g-top h1{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
.g-badge{display:inline-block;padding:4px 11px;border-radius:999px;background:var(--orange-light);color:var(--orange-dark);font-size:11.5px;font-weight:800}
.g-nav{display:flex;align-items:center;gap:10px;margin:8px 0 12px}.g-nav b{flex:1;text-align:center;font-size:16px}
.g-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.g-wd{font-size:10.5px;font-weight:800;text-transform:uppercase;opacity:.6;text-align:center;padding:4px 0}
.g-cell{min-height:92px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;gap:3px;min-width:0}
.g-empty{background:transparent;border-style:dashed;opacity:.4}
.g-today{border-color:var(--orange);box-shadow:0 0 0 2px color-mix(in srgb,var(--orange) 30%,transparent)}
.g-sel{background:color-mix(in srgb,var(--orange) 10%,var(--panel))}
.g-n{font-size:11px;font-weight:800;opacity:.7}
.g-chip{all:unset;box-sizing:border-box;display:block;cursor:pointer;font-size:11px;line-height:1.25;padding:3px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 18%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-chip b{font-weight:800}.g-more{all:unset;cursor:pointer;font-size:10.5px;font-weight:700;opacity:.7;padding:1px 4px}
.g-agenda{margin-top:18px}.g-h{margin:0 0 8px;font-size:15px;text-transform:capitalize}
.g-day{margin-bottom:12px}.g-day-h{font-size:12px;font-weight:800;opacity:.7;margin:8px 0 4px;text-transform:capitalize}
.g-card{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;background:var(--panel);margin-bottom:6px}
.g-card-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.g-tag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);white-space:nowrap}
.g-card-m{font-size:12.5px;opacity:.8;margin-top:4px;line-height:1.5}
.g-note{padding:22px;text-align:center;opacity:.7}.g-foot{margin-top:18px;font-size:11.5px;opacity:.55;text-align:center}
@media(max-width:720px){.g-grid{display:block}.g-wd,.g-empty{display:none}.g-cell{min-height:0;margin-bottom:5px;flex-direction:row;flex-wrap:wrap;align-items:center}.g-cell:not(:has(.g-chip)){display:none}.g-n{width:26px}.g-chip{max-width:100%}}

</style>
</head>
<body>
<div id="guest-root"></div>
<script>
(function(){
"use strict";
/* ====== CONFIGURACIÓN: misma base de datos que el calendario del equipo ====== */
var FIREBASE_URL = "https://calendario-a6f1f-default-rtdb.firebaseio.com/";
var ROOT = "equipo_v1";
var SPACE = "main";   /* espacio de trabajo a mostrar (el principal es "main") */
/* ============================================================================= */
var fbUrl = FIREBASE_URL;
function $(id){ return document.getElementById(id); }
function pad2(n){ return (n<10?"0":"")+n; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
var WD=["dom","lun","mar","mié","jue","vie","sáb"], MO=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function parseISO(s){ return new Date(s+"T12:00:00"); }
function iso(d){ var x=new Date(d.getTime()); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
function todayISO(){ return iso(new Date()); }
function fmtDay(s){ var d=parseISO(s); return WD[d.getDay()]+" "+d.getDate()+" "+MO[d.getMonth()].slice(0,3); }
function monthLabel(ym){ var m=+String(ym).slice(5,7); return cap(MO[m-1]||"")+" "+String(ym).slice(0,4); }
var STATUS_COLOR={"Idea":"#8a8078","Guion":"#a06bd6","Diseño":"#c98a1f","Revisión":"#2475ad","Aprobado":"#1f9d8a","Programado":"#0f8f8f","Publicado":"#2f9e63"};
var EVENT_TYPES=[{name:"Reunión",color:"#c98a1f"},{name:"Grabación / producción",color:"#c94f8a"},{name:"Entrega / deadline",color:"#b5386f"},{name:"Otro proyecto",color:"#7a5fc4"},{name:"Universidad",color:"#5b5bd6"},{name:"Trabajo",color:"#0f7d97"},{name:"Personal",color:"#8a8078"}];
function safeUrl(u){ u=String(u||"").trim(); if(!u) return ""; if(!/^https?:\/\//i.test(u)){ if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return ""; u="https://"+u; } return /^https?:\/\/[^\s\/]+\.[^\s]{2,}/i.test(u)?u:""; }
function linkify(txt){
  var re=/(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi, s=String(txt||""), o="", last=0, m;
  while((m=re.exec(s))){ var raw=m[0].replace(/[).,;:!?\]]+$/,""), u=safeUrl(raw); o+=esc(s.slice(last,m.index)); o+= u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer" class="lk">'+esc(raw)+'</a>':esc(raw); last=m.index+raw.length; re.lastIndex=last; }
  return o+esc(s.slice(last));
}
function guestParam(k){ var m=location.search.match(new RegExp("[?&]"+k+"=([^&]*)")); return m?decodeURIComponent(m[1]):""; }
var gData={pieces:{},events:{},members:{},off:false,err:"",loaded:false}, gYM="", gSel="";
function guestParam(k){ var m=location.search.match(new RegExp("[?&]"+k+"=([^&]*)")); return m?decodeURIComponent(m[1]):""; }
function guestLink(){
  var u=location.origin+location.pathname+"?invitado=1";
  if(String(fbUrl).replace(/\/+$/,"")!==String(DEFAULT_URL).replace(/\/+$/,"")) u+="&fb="+encodeURIComponent(fbUrl);
  if(ui.space && ui.space!=="main") u+="&e="+encodeURIComponent(ui.space);
  return u;
}
function guestOk(it){
  if(!it || it.vis!=="team" || !it.day) return false;
  var sp=guestParam("e")||SPACE; return (it.space||"main")===sp;
}
function guestBoot(){
  var d=new Date(); gYM=iso(d).slice(0,7);
  try{ if(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-dark","1"); }catch(x){}
  guestDraw(); guestLoad(); setInterval(guestLoad,20000);
  var gr=$("guest-root"); gr.addEventListener("click",function(e){
    var b=e.target.closest("[data-g]"); if(!b) return; var a=b.dataset.g;
    if(a==="prev"||a==="next"){ var y=+gYM.slice(0,4), m=+gYM.slice(5,7)+(a==="next"?1:-1); if(m<1){m=12;y--;} if(m>12){m=1;y++;} gYM=y+"-"+pad2(m); gSel=""; }
    else if(a==="today"){ gYM=todayISO().slice(0,7); gSel=""; }
    else if(a==="theme"){ var h=document.documentElement; if(h.getAttribute("data-dark")==="1") h.removeAttribute("data-dark"); else h.setAttribute("data-dark","1"); return; }
    else if(a==="day"){ gSel=(gSel===b.dataset.d)?"":b.dataset.d; }
    guestDraw();
  });
}
function guestLoad(){
  var u=String(fbUrl).replace(/\/+$/,"")+"/"+ROOT+"/";
  function g(p){ return fetch(u+p+".json").then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }
  /* intenta pedir solo lo público (requiere .indexOn en las reglas); si no, trae todo y filtra aquí */
  function gv(c){ return g(c+'?orderBy="vis"&equalTo="team"').catch(function(){ return g(c); }); }
  Promise.all([gv("pieces"),gv("events"),g("config/guest"),g("config/main/name")]).then(function(r){
    gData.pieces=r[0]||{}; gData.events=r[1]||{}; gData.off=!!(r[2]&&r[2].on===false); gData.cfgName=(typeof r[3]==="string"&&r[3])||"";
    var ids={}; [gData.pieces,gData.events].forEach(function(col){ Object.keys(col).forEach(function(k){ var it=col[k]; if(guestOk(it) && it.owner) ids[it.owner]=1; }); });
    /* solo el nombre de cada responsable (nunca el perfil completo, que incluye PIN) */
    return Promise.all(Object.keys(ids).map(function(id){ return g("members/"+encodeURIComponent(id)+"/name").then(function(n){ gData.members[id]={name:n}; }).catch(function(){}); }));
  }).then(function(){ gData.err=""; gData.loaded=true; guestDraw(); })
  .catch(function(e){ gData.err="No se pudo cargar el calendario ("+(e&&e.message||"sin conexión")+")"; gData.loaded=true; guestDraw(); });
}
function guestItems(){
  var out=[], mm=function(id){ var m=gData.members[id]; return m&&m.name?m.name:""; };
  Object.keys(gData.pieces||{}).forEach(function(id){ var p=gData.pieces[id]; if(!guestOk(p)) return;
    out.push({k:"p",id:id,title:p.title||"Pieza",day:p.day,time:p.time||"",end:p.end||"",who:mm(p.owner),color:STATUS_COLOR[p.status]||"#8a8078",
      tag:"Pieza"+(p.status?" · "+p.status:""),meta:[(Array.isArray(p.networks)?p.networks:[]).join(", "),p.format||""].filter(Boolean).join(" · ")}); });
  Object.keys(gData.events||{}).forEach(function(id){ var e=gData.events[id]; if(!guestOk(e)) return;
    var t=EVENT_TYPES.filter(function(x){ return x.name===e.type; })[0];
    out.push({k:"e",id:id,title:e.title||"Compromiso",day:e.day,time:e.time||"",end:e.end||"",who:mm(e.owner),color:t?t.color:"#c98a1f",tag:e.type||"Compromiso",meta:"",place:e.place||""}); });
  out.sort(function(a,b){ return (a.day+a.time)<(b.day+b.time)?-1:1; });
  return out;
}
function guestChip(it){
  return '<button type="button" class="g-chip" data-g="day" data-d="'+esc(it.day)+'" style="--c:'+esc(it.color)+'" title="'+esc(it.title)+'">'+(it.time?'<b>'+esc(it.time)+'</b> ':'')+esc(it.title)+'</button>';
}
function guestCard(it){
  var when=fmtDay(it.day)+(it.time?" · "+it.time+(it.end?"–"+it.end:""):"");
  return '<div class="g-card" style="--c:'+esc(it.color)+'"><div class="g-card-h"><b>'+esc(it.title)+'</b><span class="g-tag">'+esc(it.tag)+'</span></div><div class="g-card-m">'+esc(when)+(it.who?" · 👤 "+esc(it.who):"")+(it.meta?"<br>"+esc(it.meta):"")+(it.place?"<br>📍 "+linkify(it.place):"")+'</div></div>';
}
function guestDraw(){
  var root=$("guest-root"); if(!root) return;
  var name=(gData.cfgName)||"Calendario del equipo";
  var head='<header class="g-top"><div><h1>📅 '+esc(name)+'</h1><span class="g-badge">👀 Vista de invitado · solo lectura</span></div><div class="g-acts"><button class="btn sm" data-g="theme">◐ Tema</button></div></header>';
  if(!gData.loaded){ root.innerHTML=head+'<p class="g-note">Cargando…</p>'; return; }
  if(gData.err){ root.innerHTML=head+'<p class="g-note">'+esc(gData.err)+'</p>'; return; }
  if(gData.off){ root.innerHTML=head+'<p class="g-note">🔒 Este enlace de invitado fue desactivado por el equipo.</p>'; return; }
  var items=guestItems(), y=+gYM.slice(0,4), m=+gYM.slice(5,7);
  var first=new Date(y,m-1,1), lead=(first.getDay()+6)%7, dim=new Date(y,m,0).getDate(), today=todayISO();
  var by={}; items.forEach(function(it){ (by[it.day]=by[it.day]||[]).push(it); });
  var cells="", i;
  ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].forEach(function(w){ cells+='<div class="g-wd">'+w+'</div>'; });
  for(i=0;i<lead;i++) cells+='<div class="g-cell g-empty"></div>';
  for(i=1;i<=dim;i++){ var ds=gYM+"-"+pad2(i), L=by[ds]||[];
    cells+='<div class="g-cell'+(ds===today?" g-today":"")+(ds===gSel?" g-sel":"")+'"><span class="g-n">'+i+'</span>'+L.slice(0,3).map(guestChip).join("")+(L.length>3?'<button type="button" class="g-more" data-g="day" data-d="'+ds+'">+'+(L.length-3)+' más</button>':"")+'</div>'; }
  var list=Object.keys(by).filter(function(d){ return d.slice(0,7)===gYM; }).sort();
  var det=gSel?(by[gSel]||[]):null;
  var agenda=(det?'<h3 class="g-h">'+esc(fmtDay(gSel))+'</h3>'+(det.length?det.map(guestCard).join(""):'<p class="g-note">Sin actividades este día.</p>'):
    '<h3 class="g-h">Actividades de '+esc(monthLabel(gYM))+'</h3>'+(list.length?list.map(function(d){ return '<div class="g-day"><div class="g-day-h">'+esc(fmtDay(d))+'</div>'+by[d].map(guestCard).join("")+'</div>'; }).join(""):'<p class="g-note">No hay actividades públicas este mes.</p>'));
  root.innerHTML=head+'<div class="g-nav"><button class="btn sm" data-g="prev">‹</button><b>'+esc(monthLabel(gYM))+'</b><button class="btn sm" data-g="next">›</button><button class="btn sm" data-g="today">Hoy</button></div><div class="g-grid">'+cells+'</div><section class="g-agenda">'+agenda+'</section><p class="g-foot">Solo se muestran las actividades marcadas para todo el equipo. Esta vista no permite editar.</p>';
}

guestBoot();
})();
</script>
</body>
</html>
