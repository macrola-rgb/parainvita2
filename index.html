<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Calendario del equipo · Vista de invitado</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f6f3ee;--panel:#fff;--soft:#f1ede6;--ink:#241e17;--ink-2:#6a6157;--line:#e5dfd4;--accent:#e8601c;--accent-soft:color-mix(in srgb,var(--accent) 14%,#fff);--accent-ink:color-mix(in srgb,var(--accent) 70%,#000);--shadow:0 1px 2px rgba(40,25,10,.06),0 8px 24px -12px rgba(40,25,10,.18);color-scheme:light}
[data-dark="1"]{--bg:#121212;--panel:#1c1c1c;--soft:#262523;--ink:#f2efe9;--ink-2:#a9a198;--line:#34322e;--accent-soft:color-mix(in srgb,var(--accent) 22%,#1c1c1c);--accent-ink:color-mix(in srgb,var(--accent) 55%,#fff);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
button,input{font:inherit;color:inherit}
.btn{font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.g-chip:focus-visible,.g-card:focus-visible,.g-pill:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a.lk{color:var(--accent-ink);text-decoration:underline;word-break:break-all}
#guest-root{max-width:1120px;margin:0 auto;padding:20px 16px 48px}

/* encabezado */
.g-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.g-brand{display:flex;align-items:center;gap:12px;min-width:0}
.g-logo{width:44px;height:44px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:21px;flex:none;box-shadow:var(--shadow)}
.g-brand h1{margin:0;font-size:21px;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.g-badge{display:inline-flex;align-items:center;gap:5px;margin-top:4px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:11.5px;font-weight:800}
.g-acts{display:flex;gap:8px}

/* resumen */
.g-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.g-stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.g-stat b{display:block;font-size:24px;letter-spacing:-.02em;line-height:1.1}
.g-stat span{font-size:12px;color:var(--ink-2);font-weight:600}

/* barra de herramientas */
.g-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:14px}
.g-seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.g-seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.g-seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.g-search{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px}
.g-nav{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.g-nav b{flex:1;text-align:center;font-size:17px;letter-spacing:-.01em}

/* calendario mensual */
.g-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.g-wd{font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--ink-2);text-align:center;padding:4px 0}
.g-cell{min-height:100px;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;gap:3px;min-width:0}
.g-cell.we{background:color-mix(in srgb,var(--soft) 60%,var(--panel))}
.g-empty{background:transparent;border-style:dashed;opacity:.35}
.g-today{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 28%,transparent)}
.g-today .g-n{background:var(--accent);color:#fff;opacity:1}
.g-sel{background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.g-n{font-size:11px;font-weight:800;color:var(--ink-2);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.g-chip{all:unset;box-sizing:border-box;display:block;cursor:pointer;font-size:11px;line-height:1.25;padding:3px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 18%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-chip b{font-weight:800}
.g-more{all:unset;cursor:pointer;font-size:10.5px;font-weight:700;color:var(--ink-2);padding:1px 4px}

/* tarjetas */
.g-agenda{margin-top:18px}
.g-h{margin:0 0 10px;font-size:15px;letter-spacing:-.01em}
.g-day{margin-bottom:14px}
.g-day-h{font-size:12px;font-weight:800;color:var(--ink-2);margin:10px 0 6px;letter-spacing:.3px}
.g-card{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:11px 13px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;background:var(--panel);margin-bottom:7px;transition:transform .12s,box-shadow .12s}
.g-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.g-card-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.g-card-h b{overflow-wrap:anywhere}
.g-tag{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);white-space:nowrap}
.g-card-m{font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.55}
.g-note{padding:26px 16px;text-align:center;color:var(--ink-2);background:var(--panel);border:1px dashed var(--line);border-radius:14px}
.g-foot{margin-top:20px;font-size:11.5px;color:var(--ink-2);text-align:center}
.g-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:14px;font-size:11.5px;color:var(--ink-2)}
.g-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* detalle */
.g-ov{position:fixed;inset:0;background:rgba(10,8,5,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.g-ov.on{display:flex}
.g-dlg{width:100%;max-width:460px;max-height:88vh;overflow:auto;background:var(--panel);border-radius:18px;border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.55);padding:18px}
.g-dlg h2{margin:8px 0 4px;font-size:19px;letter-spacing:-.02em;overflow-wrap:anywhere}
.g-dlg dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px}
.g-dlg dt{color:var(--ink-2);font-weight:700}.g-dlg dd{margin:0;overflow-wrap:anywhere}
.g-dlg .g-x{float:right}

@media(max-width:720px){
  #guest-root{padding:14px 12px 40px}
  .g-brand h1{font-size:18px}
  .g-grid{display:block}.g-wd,.g-empty{display:none}
  .g-cell{min-height:0;margin-bottom:6px;flex-direction:row;flex-wrap:wrap;align-items:center;gap:5px}
  .g-cell:not(:has(.g-chip)){display:none}
  .g-n{width:26px}.g-chip{max-width:100%}
  .g-acts .btn span{display:none}
  .g-stats{grid-template-columns:repeat(3,1fr);gap:8px}.g-stat{padding:10px}.g-stat b{font-size:20px}.g-stat span{font-size:11px}
}
@media print{.g-bar,.g-acts,.g-nav,.g-ov{display:none!important}body{background:#fff}.g-card,.g-cell{break-inside:avoid}}
</style>
</head>
<body>
<div id="guest-root"></div>
<script>
(function(){
"use strict";
/* ====== CONFIGURACIÓN: misma base de datos que el calendario del equipo ====== */
var FIREBASE_URL = "https://calendario-a6f1f-default-rtdb.firebaseio.com/";
var ROOT = "equipo_v1";
var SPACE = "main";   /* espacio por defecto (el principal es "main"); el enlace puede traer ?e=ESPACIO */
/* ============================================================================= */
function param(k){ var m=location.search.match(new RegExp("[?&]"+k+"=([^&]*)")); try{ return m?decodeURIComponent(m[1]):""; }catch(e){ return ""; } }
var fbUrl = /^https:\/\/[a-z0-9-]+\.(firebaseio\.com|firebasedatabase\.app)\/?$/i.test(param("fb")) ? param("fb") : FIREBASE_URL;
var SP = param("e") || SPACE;
var STATUS_COLOR={"Idea":"#8a8078","Guion":"#a06bd6","Diseño":"#c98a1f","Revisión":"#2475ad","Aprobado":"#1f9d8a","Programado":"#0f8f8f","Publicado":"#2f9e63"};
var EVENT_TYPES=[{name:"Reunión",color:"#c98a1f"},{name:"Grabación / producción",color:"#c94f8a"},{name:"Entrega / deadline",color:"#b5386f"},{name:"Otro proyecto",color:"#7a5fc4"},{name:"Universidad",color:"#5b5bd6"},{name:"Trabajo",color:"#0f7d97"},{name:"Personal",color:"#8a8078"}];
var WD=["dom","lun","mar","mié","jue","vie","sáb"], MO=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function $(id){ return document.getElementById(id); }
function pad2(n){ return (n<10?"0":"")+n; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function parseISO(s){ return new Date(s+"T12:00:00"); }
function iso(d){ var x=new Date(d.getTime()); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
function todayISO(){ return iso(new Date()); }
function fmtDay(s){ var d=parseISO(s); return cap(WD[d.getDay()])+" "+d.getDate()+" de "+MO[d.getMonth()]; }
function monthLabel(ym){ var m=+String(ym).slice(5,7); return cap(MO[m-1])+" "+String(ym).slice(0,4); }
function rvInfo(rv,rvs){
  var ids=Array.isArray(rv.reviewers)?rv.reviewers:[], ex=Array.isArray(rv.extRev)?rv.extRev.slice(0,12):[], D=rv.decisions||{}, E=rv.extDec||{};
  var exl=ex.map(function(n,i){ var d=E["e"+i]; return {n:String(n).slice(0,40),d:d&&(d.d==="ok"||d.d==="chg")?d.d:""}; });
  var ok=ids.filter(function(x){ return D[x]&&D[x].d==="ok"; }).length+exl.filter(function(e){ return e.d==="ok"; }).length;
  return {l:rvs[0],i:rvs[1],v:+rv.version||1,ok:ok,tot:ids.length+exl.length,ex:exl,url:(rv.extShow===true&&exl.length)?safeUrl(rv.url):""};
}
function safeUrl(u){ u=String(u||"").trim(); if(!u) return ""; if(!/^https?:\/\//i.test(u)){ if(/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/|$)/i.test(u)) u="https://"+u; else return ""; } try{ var x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:""; }catch(e){ return ""; } }
function linkify(txt){
  var s=String(txt==null?"":txt), re=/(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi, o="", last=0, m;
  while((m=re.exec(s))){ var raw=m[0].replace(/[).,;:!?\]]+$/,""), u=safeUrl(raw); o+=esc(s.slice(last,m.index)); o+= u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer" class="lk">'+esc(raw)+'</a>':esc(raw); last=m.index+raw.length; re.lastIndex=last; }
  return o+esc(s.slice(last));
}
var gData={pieces:{},events:{},reviews:{},showReview:true,members:{},off:false,err:"",loaded:false,spName:"",spColor:"",cfgName:""};
var G={ym:"",sel:"",view:"mes",kind:"all",q:"",open:""};
try{ var sv=JSON.parse(localStorage.getItem("g-prefs")||"{}"); if(sv.view) G.view=sv.view; if(sv.dark===1) document.documentElement.setAttribute("data-dark","1"); else if(sv.dark===undefined && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-dark","1"); }catch(e){}
function savePrefs(){ try{ localStorage.setItem("g-prefs",JSON.stringify({view:G.view,dark:document.documentElement.getAttribute("data-dark")==="1"?1:0})); }catch(e){} }

function guestOk(it){ return !!(it && it.vis==="team" && it.day && /^\d{4}-\d{2}-\d{2}$/.test(it.day) && (it.space||"main")===SP); }

function guestBoot(){
  G.ym=todayISO().slice(0,7);
  guestDraw(); guestLoad(); setInterval(guestLoad,10000);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) guestLoad(); }); window.addEventListener("focus",guestLoad);
  var gr=$("guest-root");
  gr.addEventListener("click",function(e){
    var b=e.target.closest("[data-g]"); if(!b) return; var a=b.dataset.g;
    if(a==="prev"||a==="next"){ var y=+G.ym.slice(0,4), m=+G.ym.slice(5,7)+(a==="next"?1:-1); if(m<1){m=12;y--;} if(m>12){m=1;y++;} G.ym=y+"-"+pad2(m); G.sel=""; }
    else if(a==="refresh"){ guestLoad(); return; }
    else if(a==="today"){ G.ym=todayISO().slice(0,7); G.sel=""; }
    else if(a==="theme"){ var h=document.documentElement; if(h.getAttribute("data-dark")==="1") h.removeAttribute("data-dark"); else h.setAttribute("data-dark","1"); savePrefs(); return; }
    else if(a==="day"){ G.sel=(G.sel===b.dataset.d)?"":b.dataset.d; }
    else if(a==="view"){ G.view=b.dataset.v; G.sel=""; savePrefs(); }
    else if(a==="kind"){ G.kind=b.dataset.k; }
    else if(a==="open"){ G.open=b.dataset.i; }
    else if(a==="close"){ G.open=""; }
    guestDraw();
  });
  gr.addEventListener("input",function(e){ if(e.target.id==="g-q"){ G.q=e.target.value; var p=e.target.selectionStart; guestDraw(); var q=$("g-q"); if(q){ q.focus(); try{ q.setSelectionRange(p,p); }catch(x){} } } });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && G.open){ G.open=""; guestDraw(); } });
}
function guestLoad(){
  var u=String(fbUrl).replace(/\/+$/,"")+"/"+ROOT+"/";
  function g(p,q){ return fetch(u+p+".json?"+(q?q+"&":"")+"_t="+Date.now(),{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }
  /* pide solo lo público (requiere .indexOn en las reglas); si no, trae todo y filtra aquí */
  function gv(c){ return g(c,'orderBy="vis"&equalTo="team"').catch(function(){ return g(c); }); }
  var sp=encodeURIComponent(SP);
  var cfgP=g("config/guest"), rvP=cfgP.then(function(c){ return (c&&c.showReview===false)?{}:gv("reviews").catch(function(){ return {}; }); }).catch(function(){ return {}; });
  Promise.all([gv("pieces"),gv("events"),cfgP,g("config/main/name"),SP!=="main"?g("spaces/"+sp+"/name").catch(function(){return "";}):Promise.resolve(""),SP!=="main"?g("spaces/"+sp+"/color").catch(function(){return "";}):Promise.resolve(""),rvP]).then(function(r){
    gData.reviews=r[6]||{}; gData.showReview=!(r[2]&&r[2].showReview===false);
    gData.pieces=r[0]||{}; gData.events=r[1]||{}; gData.off=!!(r[2]&&r[2].on===false);
    gData.cfgName=(typeof r[3]==="string"&&r[3])||""; gData.spName=(typeof r[4]==="string"&&r[4])||""; gData.spColor=(typeof r[5]==="string"&&/^#[0-9a-f]{3,8}$/i.test(r[5]))?r[5]:"";
    if(gData.spColor) document.documentElement.style.setProperty("--accent",gData.spColor);
    var ids={}; [gData.pieces,gData.events].forEach(function(col){ Object.keys(col).forEach(function(k){ var it=col[k]; if(guestOk(it) && it.owner) ids[it.owner]=1; }); });
    /* solo el nombre de cada responsable (nunca el perfil completo, que incluye PIN) */
    return Promise.all(Object.keys(ids).map(function(id){ return g("members/"+encodeURIComponent(id)+"/name").then(function(n){ gData.members[id]={name:n}; }).catch(function(){}); }));
  }).then(function(){ gData.err=""; gData.loaded=true; gData.at=new Date(); guestDraw(); })
  .catch(function(e){ gData.err="No se pudo cargar el calendario ("+(e&&e.message||"sin conexión")+"). Se reintentará solo."; gData.loaded=true; guestDraw(); });
}
function guestItems(){
  var out=[], mm=function(id){ var m=gData.members[id]; return m&&m.name?m.name:""; };
  var RVL={pending:["En revisión","🔎"],changes:["Con cambios","✍"],approved:["Aprobada","✅"]}, rvBy={};
  if(gData.showReview) Object.keys(gData.reviews||{}).forEach(function(k){ var r=gData.reviews[k]; if(!r||r.vis!=="team"||(r.space||"main")!==SP||!r.piece||!RVL[r.status]) return; var o=rvBy[r.piece]; if(!o||(+r.version||1)>(+o.version||1)||((+r.version||1)===(+o.version||1)&&(r._u||0)>(o._u||0))) rvBy[r.piece]=r; });
  Object.keys(gData.pieces||{}).forEach(function(id){ var p=gData.pieces[id]; if(!guestOk(p)) return; var rv=rvBy[id]||rvBy[p.id], rvs=rv?RVL[rv.status]:null;
    out.push({k:"p",id:"p"+id,title:p.title||"Pieza",day:p.day,time:p.time||"",end:p.end||"",who:mm(p.owner),color:STATUS_COLOR[p.status]||"#8a8078",status:p.status||"",
      nets:(Array.isArray(p.networks)?p.networks:[]).join(", "),format:p.format||"",tag:"Pieza"+(p.status?" · "+p.status:"")+(rvs?" · "+rvs[1]+" "+rvs[0]:""),
      rv:rvs?rvInfo(rv,rvs):null}); });
  Object.keys(gData.events||{}).forEach(function(id){ var e=gData.events[id]; if(!guestOk(e)) return;
    var t=EVENT_TYPES.filter(function(x){ return x.name===e.type; })[0];
    out.push({k:"e",id:"e"+id,title:e.title||"Compromiso",day:e.day,time:e.time||"",end:e.end||"",who:mm(e.owner),color:t?t.color:"#c98a1f",tag:e.type||"Compromiso",place:e.place||""}); });
  out.sort(function(a,b){ return (a.day+a.time)<(b.day+b.time)?-1:1; });
  return out;
}
function guestFiltered(items){
  var q=G.q.trim().toLowerCase();
  return items.filter(function(it){
    if(G.kind==="p" && it.k!=="p") return false; if(G.kind==="e" && it.k!=="e") return false;
    if(q && (it.title+" "+(it.nets||"")+" "+(it.format||"")+" "+(it.who||"")+" "+(it.tag||"")+" "+(it.place||"")).toLowerCase().indexOf(q)<0) return false;
    return true; });
}
function guestChip(it){
  return '<button type="button" class="g-chip" data-g="open" data-i="'+esc(it.id)+'" style="--c:'+esc(it.color)+'" title="'+esc(it.title)+'">'+(it.time?'<b>'+esc(it.time)+'</b> ':'')+esc(it.title)+'</button>';
}
function guestCard(it){
  var when=fmtDay(it.day)+(it.time?" · "+it.time+(it.end?"–"+it.end:""):"");
  var meta=[it.nets,it.format].filter(Boolean).join(" · ");
  return '<button type="button" class="g-card" data-g="open" data-i="'+esc(it.id)+'" style="--c:'+esc(it.color)+'"><div class="g-card-h"><b>'+esc(it.title)+'</b><span class="g-tag">'+esc(it.tag)+'</span></div><div class="g-card-m">'+esc(when)+(it.who?" · 👤 "+esc(it.who):"")+(meta?"<br>"+esc(meta):"")+(it.place?"<br>📍 "+esc(it.place):"")+'</div></button>';
}
function guestDetail(items){
  if(!G.open) return "";
  var it=items.filter(function(x){ return x.id===G.open; })[0]; if(!it) return "";
  var rows=[["Día",fmtDay(it.day)]];
  if(it.time) rows.push(["Horario",it.time+(it.end?" – "+it.end:"")]);
  if(it.who) rows.push(["Responsable",esc(it.who)]);
  if(it.k==="p"){ if(it.status) rows.push(["Estado",esc(it.status)]); if(it.rv){ rows.push(["Revisión",esc(it.rv.i+" "+it.rv.l+" · versión "+it.rv.v+(it.rv.tot?" · "+it.rv.ok+" de "+it.rv.tot+" aprobaron":""))]);
      if(it.rv.ex&&it.rv.ex.length) rows.push(["Les toca revisar",it.rv.ex.map(function(e){ return esc(e.n)+" <small>("+(e.d==="ok"?"aprobó":e.d==="chg"?"pidió cambios":"pendiente")+")</small>"; }).join(" · ")]);
      if(it.rv.url) rows.push(["Archivo a revisar",'<a href="'+esc(it.rv.url)+'" target="_blank" rel="noopener noreferrer">Abrir archivo ↗</a>']); } if(it.nets) rows.push(["Redes",esc(it.nets)]); if(it.format) rows.push(["Formato",esc(it.format)]); }
  else if(it.place) rows.push(["Lugar / enlace",linkify(it.place)]);
  return '<div class="g-ov on" data-g="close"><div class="g-dlg" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><button class="btn sm g-x" data-g="close">Cerrar ✕</button><span class="g-tag" style="--c:'+esc(it.color)+'">'+esc(it.tag)+'</span><h2>'+esc(it.title)+'</h2><dl>'+rows.map(function(r){ return '<dt>'+r[0]+'</dt><dd>'+(r[0]==="Día"||r[0]==="Horario"||r[0]==="Lugar / enlace"?r[1]:r[1])+'</dd>'; }).join("")+'</dl></div></div>';
}
function guestDraw(){
  var root=$("guest-root"); if(!root) return;
  var name=gData.spName||gData.cfgName||"Calendario del equipo";
  var head='<header class="g-top"><div class="g-brand"><div class="g-logo">📅</div><div><h1>'+esc(name)+'</h1><span class="g-badge">👀 Vista de invitado · solo lectura</span></div></div><div class="g-acts"><button class="btn sm" data-g="refresh" title="Actualizar ahora">↻ <span>Actualizar</span></button><button class="btn sm" data-g="theme" title="Cambiar tema claro/oscuro">🌓 <span>Tema</span></button></div></header>';
  if(!gData.loaded){ root.innerHTML=head+'<p class="g-note">Cargando…</p>'; return; }
  if(gData.off){ root.innerHTML=head+'<p class="g-note">🔒 Este enlace de invitado fue desactivado por el equipo.</p>'; return; }
  var all=guestItems(), items=guestFiltered(all), y=+G.ym.slice(0,4), m=+G.ym.slice(5,7), today=todayISO();
  var inMonth=items.filter(function(i){ return i.day.slice(0,7)===G.ym; });
  var nP=inMonth.filter(function(i){return i.k==="p";}).length, nE=inMonth.length-nP;
  var wkEnd=iso(new Date(Date.now()+7*864e5)), next7=all.filter(function(i){ return i.day>=today && i.day<=wkEnd; }).length;
  var stats='<div class="g-stats"><div class="g-stat"><b>'+nP+'</b><span>Piezas en '+esc(MO[m-1])+'</span></div><div class="g-stat"><b>'+nE+'</b><span>Compromisos en '+esc(MO[m-1])+'</span></div><div class="g-stat"><b>'+next7+'</b><span>Próximos 7 días</span></div></div>';
  var bar='<div class="g-bar"><div class="g-seg" role="tablist"><button data-g="view" data-v="mes" class="'+(G.view==="mes"?"on":"")+'">▦ Mes</button><button data-g="view" data-v="lista" class="'+(G.view==="lista"?"on":"")+'">☰ Lista</button></div>'
    +'<div class="g-seg"><button data-g="kind" data-k="all" class="'+(G.kind==="all"?"on":"")+'">Todo</button><button data-g="kind" data-k="p" class="'+(G.kind==="p"?"on":"")+'">Piezas</button><button data-g="kind" data-k="e" class="'+(G.kind==="e"?"on":"")+'">Compromisos</button></div>'
    +'<input id="g-q" class="g-search" type="search" placeholder="Buscar por título, red, formato o persona…" value="'+esc(G.q)+'" autocomplete="off"></div>';
  var nav='<div class="g-nav"><button class="btn sm" data-g="prev" aria-label="Mes anterior">‹</button><b>'+esc(monthLabel(G.ym))+'</b><button class="btn sm" data-g="next" aria-label="Mes siguiente">›</button><button class="btn sm" data-g="today">Hoy</button></div>';
  var by={}; items.forEach(function(it){ (by[it.day]=by[it.day]||[]).push(it); });
  var body="";
  if(G.view==="mes"){
    var first=new Date(y,m-1,1), lead=(first.getDay()+6)%7, dim=new Date(y,m,0).getDate(), cells="", i;
    ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].forEach(function(w){ cells+='<div class="g-wd">'+w+'</div>'; });
    for(i=0;i<lead;i++) cells+='<div class="g-cell g-empty"></div>';
    for(i=1;i<=dim;i++){ var ds=G.ym+"-"+pad2(i), L=by[ds]||[], dow=(lead+i-1)%7;
      cells+='<div class="g-cell'+(dow>=5?" we":"")+(ds===today?" g-today":"")+(ds===G.sel?" g-sel":"")+'"><span class="g-n">'+i+'</span>'+L.slice(0,3).map(guestChip).join("")+(L.length>3?'<button type="button" class="g-more" data-g="day" data-d="'+ds+'">+'+(L.length-3)+' más</button>':"")+'</div>'; }
    var det=G.sel?(by[G.sel]||[]):null;
    var list=Object.keys(by).filter(function(d){ return d.slice(0,7)===G.ym; }).sort();
    var agenda=(det?'<h3 class="g-h">'+esc(fmtDay(G.sel))+'</h3>'+(det.length?det.map(guestCard).join(""):'<p class="g-note">Sin actividades este día.</p>'):
      '<h3 class="g-h">Actividades de '+esc(monthLabel(G.ym).toLowerCase())+'</h3>'+(list.length?list.map(function(d){ return '<div class="g-day"><div class="g-day-h">'+esc(fmtDay(d))+'</div>'+by[d].map(guestCard).join("")+'</div>'; }).join(""):'<p class="g-note">No hay actividades públicas este mes'+(G.q||G.kind!=="all"?" con esos filtros":"")+'.</p>'));
    body=nav+'<div class="g-grid">'+cells+'</div><section class="g-agenda">'+agenda+'</section>';
  } else {
    var up=Object.keys(by).filter(function(d){ return d>=today; }).sort();
    body='<section class="g-agenda" style="margin-top:0"><h3 class="g-h">Próximas actividades</h3>'+(up.length?up.map(function(d){ return '<div class="g-day"><div class="g-day-h">'+(d===today?"Hoy · ":"")+esc(fmtDay(d))+'</div>'+by[d].map(guestCard).join("")+'</div>'; }).join(""):'<p class="g-note">No hay actividades próximas'+(G.q||G.kind!=="all"?" con esos filtros":"")+'.</p>')+'</section>';
  }
  var legend='<div class="g-legend">'+Object.keys(STATUS_COLOR).map(function(s){ return '<span><i style="background:'+STATUS_COLOR[s]+'"></i>'+esc(s)+'</span>'; }).join("")+'</div>';
  var err=gData.err?'<p class="g-note" style="margin-bottom:12px">⚠️ '+esc(gData.err)+'</p>':"";
  root.innerHTML=head+err+stats+bar+body+legend+'<p class="g-foot">'+(gData.at?'Actualizado '+pad2(gData.at.getHours())+':'+pad2(gData.at.getMinutes())+' · se refresca solo cada 10 s · ':'')+'Solo se muestran las actividades marcadas «Todo el equipo».</p>'+guestDetail(all);
}
guestBoot();
})();
</script>
